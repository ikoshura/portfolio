<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; background: #2b2e33; }
    #pages { width: 100vw; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px 0; }
    canvas { width: min(88vw, 900px); height: auto; display: block; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
    .dl {
      position: fixed; bottom: 20px; right: 20px; z-index: 10;
      background: rgba(0,0,0,.72); color: #fff;
      padding: 10px 16px; border-radius: 999px; text-decoration: none;
      font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600;
      border: 1px solid rgba(255,255,255,.22);
    }
    .dl:hover { background: rgba(0,0,0,.9); }
  </style>
</head>
<body>
  <a class="dl" href="./portfolio.pdf" download>⤓ Download</a>
  <div id="pages"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (async () => {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument('./portfolio.pdf').promise;
      const host = document.getElementById('pages');

      async function render() {
        host.innerHTML = '';
        const cssWidth = window.innerWidth;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const base = page.getViewport({ scale: 1 });
          const scale = cssWidth / base.width;
          const viewport = page.getViewport({ scale: scale * dpr });
          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          host.appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }
      }

      let t;
      window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 250); });
      await render();
    })().catch(() => {
      document.getElementById('pages').innerHTML =
        '<div style="color:#fff;font-family:sans-serif;padding:40px;text-align:center">' +
        '<a href="./portfolio.pdf" style="color:#fff">Open PDF</a></div>';
    });
  </script>
</body>
</html>
