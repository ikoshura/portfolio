<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; background: #fff; }
    #pages { width: 100vw; }
    canvas { width: 100vw; height: auto; display: block; }
  </style>
</head>
<body>
  <div id="pages"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (async () => {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument('./portfolio.pdf').promise;
      const host = document.getElementById('pages');

      async function render() {
        host.innerHTML = '';
        const cssWidth = window.innerWidth;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const base = page.getViewport({ scale: 1 });
          const scale = cssWidth / base.width;
          const viewport = page.getViewport({ scale: scale * dpr });
          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          host.appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }
      }

      let t;
      window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 250); });
      await render();
    })().catch(() => {
      document.getElementById('pages').innerHTML =
        '<div style="color:#fff;font-family:sans-serif;padding:40px;text-align:center">' +
        '<a href="./portfolio.pdf" style="color:#fff">Open PDF</a></div>';
    });
  </script>
</body>
</html>
