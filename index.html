<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abrar Zharifan Syah — Portfolio</title>
  <meta name="description" content="Portfolio PDF of Abrar Zharifan Syah" />
  <style>
    html, body { margin: 0; height: 100%; background: #1a1a1a; }
    .viewer { position: fixed; inset: 0; }
    iframe, embed, object { width: 100%; height: 100%; border: 0; display: block; background: #1a1a1a; }
    .fallback {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #fff; font-family: system-ui, -apple-system, sans-serif;
      text-align: center; padding: 24px; max-width: 90vw;
    }
    .fallback a {
      color: #fff; background: #2563eb; padding: 10px 18px;
      border-radius: 8px; text-decoration: none; display: inline-block; margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <iframe src="./portfolio.pdf" title="Abrar Zharifan Syah — Portfolio PDF" allow="fullscreen">
      <div class="fallback">
        <p>Your browser can't preview this PDF.</p>
        <a href="./portfolio.pdf" download>Download Portfolio PDF</a>
      </div>
    </iframe>
  </div>
</body>
</html>
